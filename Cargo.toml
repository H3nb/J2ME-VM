[package]
name = "j2me-vm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Experimental, host-independent Java ME VM research core"
publish = false

[dependencies]
miniz_oxide = { version = "0.9.1", default-features = false }
rawzip = { version = "0.5.2", default-features = false }

[dev-dependencies]
rawzip = { version = "0.5.2", default-features = false, features = ["std"] }
